name: MLflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MLflow Project
        working-directory: Workflow-CI/MLProject
        run: |
          python modelling.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: Workflow-CI/MLProject/artifacts/model.pkl

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image with MLflow
        working-directory: Workflow-CI/MLProject
        run: |
          mlflow models build-docker \
            --model-uri ./artifacts/mlflow_model \
            --name yosephas/telco-customer-churn:latest \
            --env-manager local

      - name: Push Docker image to Docker Hub
        run: |
          docker push yosephas/telco-customer-churn:latest
